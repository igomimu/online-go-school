name: Build Check

# Vercelの本番デプロイと同じ `npm run build`(tsc -b && vite build)をCIで実行し、
# ビルド失敗を push/PR の時点でGitHub上に検知する。
# あわせて ESLint と Vitest も回す。以前はビルドだけだったため、単体テスト825件が
# 自動では一度も実行されず、壊れても機械が止められなかった（2026-09-07 Codex レビュー #6）。
# `npx tsc --noEmit` はルートの tsconfig.json が files:[] のプロジェクト参照専用構成のため
# 実質何もチェックしない(2026-07-15判明)。ビルド健全性の確認は必ずこのワークフローと
# 同じ `npm run build` を使うこと。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 本番の環境変数は渡さない。テストは src/test/setup.ts で偽アドレスに固定しており、
      # 本番の Supabase へ触れずに通る（触れていたら、ここで落ちるのが正しい）
      - name: Unit tests
        run: npm test

      - name: Build (same command as Vercel production build)
        run: npm run build
